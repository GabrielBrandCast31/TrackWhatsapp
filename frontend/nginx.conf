server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # O index.html aponta pro bundle com hash no nome. Se o navegador guardar um
  # index velho, o painel continua rodando codigo antigo depois de um deploy —
  # foi exatamente isso que fez a aba Prospeccao chamar rota que ja nao existia.
  location = /index.html {
    add_header Cache-Control "no-store, must-revalidate";
  }

  # Ja os assets tem hash no nome: nome novo a cada build, entao cache eterno.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # a API e o webhook da Meta passam pelo mesmo host — assim uma URL publica so
  # (ex.: o tunel do ngrok apontando pra porta 8080) serve painel e webhook.
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /webhook/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
