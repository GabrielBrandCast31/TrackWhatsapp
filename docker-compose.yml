services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: tracker
      POSTGRES_DB: tracker
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tracker']
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://tracker:tracker@db:5432/tracker
    depends_on:
      db:
        condition: service_healthy
    # so o localhost da maquina: na VPS quem fala com o mundo e o nginx do
    # frontend, que ja faz proxy de /api e /webhook. A API tambem exige login,
    # mas nao ha motivo pra ter duas portas abertas.
    ports:
      - '127.0.0.1:8000:8000'
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:8000/api/health']
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - '8030:80'

volumes:
  pgdata:
