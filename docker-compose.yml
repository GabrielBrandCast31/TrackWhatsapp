services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: tracker
      POSTGRES_DB: tracker
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tracker']
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://tracker:tracker@db:5432/tracker
    depends_on:
      db:
        condition: service_healthy
    # so o localhost da maquina: na VPS quem fala com o mundo e o nginx do
    # frontend, que ja faz proxy de /api e /webhook. A API tambem exige login,
    # mas nao ha motivo pra ter duas portas abertas.
    ports:
      - '127.0.0.1:8040:8000'
    # no Docker do Linux (VPS) 'host.docker.internal' nao resolve sozinho como
    # no Docker Desktop. Isso mapeia o nome pro gateway do host, pra que a URL
    # da Evolution possa apontar pra um servico que roda fora do compose.
    # Continua aqui como escape hatch pra apontar pra uma Evolution que rode
    # fora do Docker; o caminho normal agora e a rede evolution-net abaixo.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    # A Evolution vive no compose dela (Teste/evolution). Entrar na rede dela
    # deixa o backend chamar 'http://evolution-api:8080' por DNS interno do
    # Docker, em vez de sair pelo host: some a dependencia de porta publicada,
    # de firewall entre bridge e host, e de a Evolution ter de escutar em
    # 0.0.0.0 — que era o que expunha o controle das sessoes na internet.
    # 'default' precisa estar listado: declarar networks tira o servico da rede
    # padrao, e sem ela o backend perde o db e o frontend perde o backend.
    networks:
      - default
      - evolution-net
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:8000/api/health']
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - '3031:80'

networks:
  # criada pelo compose da Evolution (Teste/evolution/docker-compose.yml).
  # 'external' = este compose nao cria nem apaga: suba a Evolution primeiro,
  # senao o 'docker compose up' daqui falha dizendo que a rede nao existe.
  evolution-net:
    external: true

volumes:
  pgdata:
